backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "المقالات"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "العنوان", name: "title", widget: "string" }
      - { label: "التاريخ", name: "date", widget: "datetime" }
      - { label: "القسم", name: "category", widget: "string" }
      - { label: "ملخص المقال", name: "description", widget: "text" }
      - { label: "الصورة", name: "image", widget: "image", required: false }
      - { label: "محتوى المقال", name: "body", widget: "markdown" }
